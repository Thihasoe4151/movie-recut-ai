<!doctype html>
<html lang="my">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Movie Recut AI</title>
  <style>
    :root{font-family:Inter,system-ui,"Noto Sans Myanmar",sans-serif;color:#eee;background:#0d1117}
    body{margin:0;background:linear-gradient(135deg,#0d1117,#111827);min-height:100vh}
    .wrap{max-width:1100px;margin:0 auto;padding:28px}
    h1{margin:0 0 6px;font-size:30px}.sub{color:#9ca3af;margin-bottom:24px}
    .card{background:#151b25;border:1px solid #283244;border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:0 8px 30px #0004}
    label{display:block;font-size:14px;color:#aeb8c8;margin-bottom:8px}
    input,select,button,textarea{font:inherit}
    input[type=password],input[type=file],select{width:100%;box-sizing:border-box;background:#0f141d;color:#eee;border:1px solid #344054;border-radius:10px;padding:12px}
    button{border:0;border-radius:10px;padding:12px 16px;cursor:pointer;font-weight:700}
    .primary{background:#7c5cff;color:#fff}.secondary{background:#263247;color:#fff}
    .danger{background:#572332;color:#fff}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    video{width:100%;border-radius:14px;background:#000;max-height:480px}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
    .status{padding:12px;border-radius:10px;background:#0e1520;color:#b8c4d6;margin-top:14px;white-space:pre-wrap}
    .seg{border:1px solid #2c3749;border-radius:12px;padding:12px;margin:10px 0}
    .time{font-size:12px;color:#8fa0b8}.orig{color:#aeb8c8;margin:6px 0}
    textarea{width:100%;box-sizing:border-box;min-height:72px;background:#0f141d;color:#fff;border:1px solid #344054;border-radius:8px;padding:10px;line-height:1.55}
    a{color:#a78bfa}.hidden{display:none}
    @media(max-width:760px){.grid{grid-template-columns:1fr}.wrap{padding:14px}}
  </style>
</head>
<body>
<div class="wrap">
  <h1>🎬 Movie Recut AI</h1>
  <div class="sub">Video → Speech → မြန်မာဘာသာပြန် → နူးညံ့သော AI Voice → MP4</div>

  <div class="card">
    <div class="grid">
      <div>
        <label>OpenAI API Key</label>
        <input id="key" type="password" placeholder="sk-..." autocomplete="off" />
      </div>
      <div>
        <label>Text model</label>
        <select id="model">
          <option value="gpt-5.6-luna">gpt-5.6-luna</option>
          <option value="gpt-5.6-terra">gpt-5.6-terra</option>
        </select>
      </div>
    </div>
    <div style="margin-top:16px">
      <label>Video (အများဆုံး 15 မိနစ်)</label>
      <input id="video" type="file" accept="video/*" />
    </div>
    <div class="actions">
      <button class="primary" id="analyze">1. Analyze Video</button>
    </div>
    <div id="status" class="status">Ready.</div>
  </div>

  <div class="card hidden" id="previewCard">
    <div class="grid">
      <div>
        <label>Video Preview</label>
        <video id="player" controls></video>
      </div>
      <div>
        <label>Myanmar Voice</label>
        <select id="voice">
          <option value="coral">Coral — နူးညံ့/သဘာဝကျ</option>
          <option value="marin">Marin — ငြိမ်သက်/ပျော့ပျောင်း</option>
          <option value="shimmer">Shimmer — ကြည်လင်/နူးညံ့</option>
          <option value="nova">Nova — နွေးထွေး/သဘာဝကျ</option>
          <option value="sage">Sage — အေးဆေး/တည်ငြိမ်</option>
        </select>
        <label style="margin-top:14px">Voice Speed</label>
        <input id="speed" type="range" min="0.75" max="1.25" step="0.01" value="1" />
        <div id="speedValue" class="time">1.00x</div>
        <div class="actions">
          <button class="primary" id="translate">2. Translate + Correct Burmese</button>
          <button class="secondary" id="export">3. Generate Voice + Export MP4</button>
        </div>
      </div>
    </div>
  </div>

  <div class="card hidden" id="segmentsCard">
    <label>Dialogue / Translation</label>
    <div id="segments"></div>
  </div>

  <div class="card hidden" id="resultCard">
    <h3>Export Ready</h3>
    <div class="actions">
      <a id="videoLink" target="_blank">🎬 Open MP4</a>
      <a id="srtLink" target="_blank">📝 Open SRT</a>
    </div>
  </div>
</div>

<script>
const API = window.location.origin;
let jobId = null;
let segments = [];

const $ = id => document.getElementById(id);
function status(s){$("status").textContent=s}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function renderSegments(){
  $("segments").innerHTML = segments.map((s,i)=>`
    <div class="seg">
      <div class="time">${fmt(s.start)} → ${fmt(s.end)}</div>
      <div class="orig"><b>Original:</b> ${esc(s.text)}</div>
      <textarea data-i="${i}" class="mytext" placeholder="မြန်မာဘာသာပြန်">${esc(s.text_my||"")}</textarea>
    </div>`).join("");
  document.querySelectorAll(".mytext").forEach(el=>{
    el.addEventListener("input",e=>segments[+e.target.dataset.i].text_my=e.target.value)
  });
}
function fmt(sec){
  sec=Math.max(0,Math.floor(sec)); const m=Math.floor(sec/60), s=sec%60;
  return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}
$("speed").oninput=()=>$("speedValue").textContent=(+$("speed").value).toFixed(2)+"x";

$("analyze").onclick=async()=>{
  const file=$("video").files[0], key=$("key").value.trim();
  if(!file) return status("Video ဖိုင်ရွေးပါ။");
  if(!key) return status("API Key ထည့်ပါ။");
  const fd=new FormData(); fd.append("video",file); fd.append("api_key",key);
  status("Video စစ်ဆေးပြီး speech ကို transcribe လုပ်နေပါတယ်…");
  try{
    const r=await fetch(API+"/api/analyze",{method:"POST",body:fd});
    const data=await r.json(); if(!r.ok) throw new Error(data.detail||"Analyze failed");
    jobId=data.job_id; segments=data.segments;
    $("player").src=URL.createObjectURL(file);
    $("previewCard").classList.remove("hidden");
    $("segmentsCard").classList.remove("hidden");
    renderSegments();
    status(`Done. Duration: ${data.duration.toFixed(1)} sec\nSegments: ${segments.length}`);
  }catch(e){status("Error: "+e.message)}
};

$("translate").onclick=async()=>{
  if(!jobId) return status("အရင် Analyze လုပ်ပါ။");
  const fd=new FormData();
  fd.append("job_id",jobId); fd.append("api_key",$("key").value.trim());
  fd.append("model",$("model").value); fd.append("segments_json",JSON.stringify(segments));
  status("မြန်မာဘာသာပြန် + စာလုံးပေါင်းပြင်ဆင်နေပါတယ်…");
  try{
    const r=await fetch(API+"/api/translate",{method:"POST",body:fd});
    const data=await r.json(); if(!r.ok) throw new Error(data.detail||"Translate failed");
    segments=data.segments; renderSegments(); status("Translation ပြီးပါပြီ။ စာသားကို လိုသလို ပြင်နိုင်ပါတယ်။");
  }catch(e){status("Error: "+e.message)}
};

$("export").onclick=async()=>{
  if(!jobId) return status("အရင် Analyze လုပ်ပါ။");
  for(const s of segments) if(!s.text_my) s.text_my=s.text;
  const fd=new FormData();
  fd.append("job_id",jobId); fd.append("api_key",$("key").value.trim());
  fd.append("voice",$("voice").value); fd.append("speed",$("speed").value);
  fd.append("segments_json",JSON.stringify(segments));
  status("TTS အသံထုတ်ပြီး video ကို recut/export လုပ်နေပါတယ်… အချိန်အနည်းငယ်ကြာနိုင်ပါတယ်။");
  try{
    const r=await fetch(API+"/api/export",{method:"POST",body:fd});
    const data=await r.json(); if(!r.ok) throw new Error(data.detail||"Export failed");
    $("resultCard").classList.remove("hidden");
    $("videoLink").href=API+data.video_url;
    $("srtLink").href=API+data.srt_url;
    status("Export ပြီးပါပြီ။ MP4 နဲ့ SRT ကို အောက်မှာဖွင့်နိုင်ပါတယ်။");
  }catch(e){status("Error: "+e.message)}
};
</script>
</body>
</html>
